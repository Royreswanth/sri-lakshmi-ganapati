<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#084D6E" />
      <stop offset="40%" stop-color="#0E2A47" />
      <stop offset="100%" stop-color="#060C16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="235" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35" />
  <circle cx="256" cy="235" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Inner Medallion -->
  <circle cx="256" cy="235" r="148" fill="#0A1626" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)" />

  <!-- LineBook Pro Iconic Ledger / Financial Shield Emblem -->
  <!-- Book / Ledger Base with Golden Spine -->
  <rect x="180" y="145" width="152" height="175" rx="16" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Spine Line -->
  <line x1="210" y1="145" x2="210" y2="320" stroke="url(#goldGrad)" stroke-width="4" opacity="0.7" />

  <!-- Rupee & Growth Line Symbol in Gold -->
  <!-- Rupee Symbol -->
  <path d="M236 185 L282 185 M236 198 L276 198 M236 185 C270 185 270 220 236 220 L278 275" 
        fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Security Shield Sparkle Accent -->
  <polygon points="256,122 262,136 276,142 262,148 256,162 250,148 236,142 250,136" fill="#FDE047" />

  <!-- Growth Line Curves -->
  <path d="M190 285 Q220 250 256 260 T318 220" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <circle cx="318" cy="220" r="5" fill="#10B981" />

  <!-- Branding Text: LineBook Pro -->
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">LINEBOOK PRO</text>
  <text x="256" y="448" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#94A3B8" letter-spacing="6">VILLAGE FINANCE</text>
</svg>
