name: Build LineBook Pro Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Grant Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Compile Android Debug APK (Directly Installable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare named LineBook Pro APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LineBook-Pro-v4.0.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineBook-Pro-v4.0-APK
          path: LineBook-Pro-v4.0.apk
          retention-days: 90
